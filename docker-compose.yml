services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: experiment_hub
    ports:
      - "5433:5432" # 5433 on the host, so it does not clash with another local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d experiment_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
